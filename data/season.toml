# The 2026-27 curling season. This file is the source of truth for WHICH events exist.
# Draw-level data is generated into data/draws/ by `python -m curlcal.refresh`.
#
# tier 1 = headline event, game entries go on the personal calendar too.
# tier 2 = lower-profile, tournament block only on the personal calendar.
# end is the last day of play (inclusive). tz is the venue's IANA time zone.

season = "2026-27"
tracked = ["CAN", "ESP", "TUR", "CZE"]

# worldcurling.org/events/<slug>/ entries that are deliberately not on the calendar.
ignored_wcf_slugs = ["congress", "europeans", "olympics", "page", "paralympics", "wcpqe", "wcpqpc", "yog2024"]

[watch]
gsoc = "DAZN (free outside Canada and the US) carries the afternoon and evening draws, playoffs and finals. Rock Channel has every game (C$19.99/month)."
rock_league = "DAZN (free outside Canada and the US), or Rock Channel."
tsn = "TSN."
tsn_worlds = "TSN, or a Curling Channel season pass (US$99.99)."
curling_channel = "Curling Channel (season pass US$99.99)."
wcf_scores = "No stream listed by World Curling. Live scores: livescores.worldcurling.org"
canadian = "Coverage not confirmed. Check curling.ca closer to the event."

