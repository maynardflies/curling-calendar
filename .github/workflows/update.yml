name: Update calendar

on:
  schedule:
    - cron: "17 5 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -t .
      # A failed source keeps its previous draws, so still publish what we have
      # and let the final step turn the run red.
      - name: Refresh schedules
        id: refresh
        continue-on-error: true
        run: python -m curlcal.refresh
      - name: Save schedule changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/draws
          if git diff --cached --quiet; then
            echo "No schedule changes"
          else
            git commit -m "Update schedules"
            git push
          fi
      - run: python -m curlcal.build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v5
      - name: Check World Curling for events we don't list
        run: python -m curlcal.refresh --check-new
      - name: Fail if a schedule source broke
        if: steps.refresh.outcome == 'failure'
        run: |
          echo "A schedule source failed; see the Refresh schedules step."
          exit 1
